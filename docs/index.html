<!doctype html>
<html xmnls="http://www.w3.org/1999/xhtml">
<head>

  <meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="cache-control" content="no-cache, no-store">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <meta name="description" content="An expressive visual storytelling environment for presenting timelines">
  <meta name="keywords" content="timeline,storytelling,visualization">
  <title>Timeline Storyteller</title>
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">

  <!-- dataviz.jp shared language resolver: ?lang=, /en path, locale cookie, html lang, browser language -->
  <script src="https://id.data-viz-lectures.com/lib/dataviz-locale.v1.js"></script>
  <script>
    if (window.DatavizLocale) { document.documentElement.lang = window.DatavizLocale.resolve(); }
  </script>

  <!-- dataviz.jp shared sign-in, header (48px) and tool header (about 56px below it). Order matters. -->
  <script src="https://id.data-viz-lectures.com/lib/supabase.v1.js"></script>
  <script src="https://id.data-viz-lectures.com/lib/dataviz-auth-client.v1.js"></script>
  <script src="https://id.data-viz-lectures.com/lib/dataviz-tool-header.v1.js" defer></script>
  <style>
    html, body { height: 100%; margin: 0; }
    #app { position: absolute; top: 104px; right: 0; bottom: 0; left: 0; background-color: white; }
  </style>

</head>

<body>
  <dataviz-tool-header></dataviz-tool-header>
  <div id="app"></div>
</body>

<!-- Dependencies, served from this site (copied from node_modules by "npm run package") -->
<script src="js/vendor/d3.min.js" charset="utf-8"></script>
<script src="js/vendor/moment.min.js" charset="UTF-8"></script>

<script type="text/javascript" src="js/timelinestoryteller.js" charset="UTF-8"></script>

<!-- Timeline Storyteller component -->
<script>
  var teller = new TimelineStoryteller(true, true, document.getElementById("app"));
  teller.setOptions({

  //   showIntro: false,
  //   animations: false,
  //   animationStepDuration: 500,
  });
</script>

</html>
